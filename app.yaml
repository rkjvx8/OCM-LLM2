name: ocm-llm-app
region: "nyc1"
services:
  - name: web
    github:
      repo: "rkjvx8/OCM-LLM2"
      branch: "main"
      deploy_on_push: false
    dockerfile_path: "Dockerfile"
    run_command: "python web.py"
    http_port: 5000
    instance_size_slug: "basic-xxs"
    instance_count: 1
    instance_type: "web"
    envs:
      - key: "OPENAI_API_KEY"
        scope: "RUN_TIME"
      - key: "PORT"
        value: "5000"
        scope: "RUN_TIME"
